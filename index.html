  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    #slideshow {
      position: absolute;
      inset: 0;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide {
      position: absolute;
      inset: 40px 40px 80px 40px;
      /* 아래쪽 티커 공간 확보 */
      display: none;
      flex-direction: row;
      gap: 40px;
      align-items: center;
      justify-content: center;
    }

    .slide.active {
      display: flex;
    }

    .slide img {
      max-width: 40vw;
      max-height: 60vh;
      object-fit: contain;
    }

    .slide-text {
      max-width: 45vw;
    }

    .slide-title {
      font-size: 2.2rem;
      font-weight: 700;
      margin-bottom: 20px;
    }

    .slide-body {
      font-size: 1.3rem;
      line-height: 1.5;
      white-space: pre-line;
    }

    #header {
      text-align: center;
      /* 이미지 중앙 정렬 */
      padding-top: 20px;
      position: relative;
      z-index: 10;
      height: 100px;
      /* 헤더 영역 높이 지정 */
    }

    #header img {
      height: 140px;
      /* 로고 이미지 크기 설정 */
      object-fit: contain;
    }

    /* 뉴스 티커 영역 */
    #ticker-wrapper {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 60px;
      background: rgba(0, 0, 0, 0.8);
      overflow: hidden;
      border-top: 2px solid #444;
      display: flex;
      align-items: center;
    }

    #ticker {
      white-space: nowrap;
      display: inline-block;
      padding-left: 100%;
      animation: scroll-left 60s linear infinite;
      /* 티커 속도 60s로 제한 더 빠르게 할거면 줄이면 됨 */
      font-size: 1.1rem;
    }

    #ticker span {
      margin-right: 100px;
    }

    @keyframes scroll-left {
      0% {
        transform: translateX(0);
      }

      100% {
        transform: translateX(-100%);
      }

    }
  </style>
</head>

    const SLIDE_DURATION = 8000; // 한 슬라이드당 8초

    const slideshowEl = document.getElementById("slideshow");
    const tickerEl = document.getElementById("ticker");
    // 2) 슬라이드 DOM 생성
    NEWS.forEach((item, index) => {
      const slide = document.createElement("div");
      slide.className = "slide";
      if (index === 0) slide.classList.add("active");

      if (item.image) {
        const img = document.createElement("img");
        img.src = item.image;
        img.alt = item.title;
        slide.appendChild(img);
      }

      const textBox = document.createElement("div");
      textBox.className = "slide-text";

      const title = document.createElement("div");
      title.className = "slide-title";
      title.textContent = item.title;

      const body = document.createElement("div");
      body.className = "slide-body";
      body.textContent = item.body;

      textBox.appendChild(title);
      textBox.appendChild(body);

      if (item.linkUrl && item.linkText) {
        const linkWrapper = document.createElement("div");
        linkWrapper.className = "slide-link"; // 스타일 적용을 위해 클래스 추가

        const link = document.createElement("a");
        link.href = item.linkUrl;
        link.textContent = item.linkText;
        link.target = "_blank"; // 새 창/탭에서 열리도록 설정 (선택 사항)

        linkWrapper.appendChild(link);
        textBox.appendChild(linkWrapper);
      }

      slide.appendChild(textBox);

      slideshowEl.appendChild(slide);
    });

    // 3) 티커 텍스트 구성
    tickerEl.innerHTML = "";
    NEWS.forEach(item => {
      const span = document.createElement("span");
      span.textContent = item.ticker || item.title;
      tickerEl.appendChild(span);
    });

    // 4) 슬라이드 자동 전환
    let currentIndex = 0;
    const slides = document.querySelectorAll(".slide");

    setInterval(() => {
      slides[currentIndex].classList.remove("active");
      currentIndex = (currentIndex + 1) % slides.length;
      slides[currentIndex].classList.add("active");
    }, SLIDE_DURATION);
